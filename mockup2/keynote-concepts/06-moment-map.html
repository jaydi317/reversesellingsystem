<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE MOMENT MAP — Reverse Selling</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#091731}body{display:grid;place-items:center;padding:24px}main{width:min(1200px,100%);filter:drop-shadow(0 24px 50px #0007)}svg{display:block;width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
