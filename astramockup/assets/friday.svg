<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="title desc"><title id="title">Make Friday easier to start.</title><desc id="desc">One useful result beats a folder of things you might try someday.</desc><rect width="720" height="230" fill="#f8f5ef"/><g fill="#252622" font-family="Arial,sans-serif"><text x="25" y="35" font-size="18" font-weight="700">Make Friday easier to start.</text><g transform="rotate(-1 125 110)"><rect x="25" y="65" width="205" height="100" rx="3" fill="none" stroke="#252622" stroke-width="3"/><text x="127" y="108" text-anchor="middle" font-size="21" font-weight="700">Pick one job</text><text x="127" y="137" text-anchor="middle" font-size="15">Keep it small.</text></g><path d="M 237 115 h 18 m -7 -6 l 7 6 -7 6" stroke="#a94127" fill="none" stroke-width="3"/><g transform="rotate(1 360 110)"><rect x="260" y="65" width="205" height="100" rx="3" fill="none" stroke="#252622" stroke-width="3"/><text x="362" y="108" text-anchor="middle" font-size="21" font-weight="700">Try one sample</text><text x="362" y="137" text-anchor="middle" font-size="15">Use safe example data.</text></g><path d="M 472 115 h 18 m -7 -6 l 7 6 -7 6" stroke="#a94127" fill="none" stroke-width="3"/><g transform="rotate(-1 595 110)"><rect x="495" y="65" width="205" height="100" rx="3" fill="none" stroke="#a94127" stroke-width="3"/><text x="597" y="108" text-anchor="middle" font-size="21" font-weight="700">Keep what helps</text><text x="597" y="137" text-anchor="middle" font-size="15">Check it against the job.</text></g><text x="25" y="208" font-size="15">One useful result beats a folder of things you might try someday.</text></g></svg>