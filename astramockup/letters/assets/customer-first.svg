<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="title desc"><title id="title">Start with the person you want to help.</title><desc id="desc">A clearer message starts with a clearer understanding of the customer.</desc><rect width="720" height="230" fill="#f8f5ef"/><g fill="#252622" font-family="Arial,sans-serif"><text x="25" y="35" font-size="18" font-weight="700">Start with the person you want to help.</text><g transform="rotate(-1 125 110)"><rect x="25" y="65" width="205" height="100" rx="3" fill="none" stroke="#252622" stroke-width="3"/><text x="127" y="108" text-anchor="middle" font-size="21" font-weight="700">Their question</text><text x="127" y="137" text-anchor="middle" font-size="15">What matters to them?</text></g><path d="M 237 115 h 18 m -7 -6 l 7 6 -7 6" stroke="#a94127" fill="none" stroke-width="3"/><g transform="rotate(1 360 110)"><rect x="260" y="65" width="205" height="100" rx="3" fill="none" stroke="#252622" stroke-width="3"/><text x="362" y="108" text-anchor="middle" font-size="21" font-weight="700">Your real answer</text><text x="362" y="137" text-anchor="middle" font-size="15">What can you prove?</text></g><path d="M 472 115 h 18 m -7 -6 l 7 6 -7 6" stroke="#a94127" fill="none" stroke-width="3"/><g transform="rotate(-1 595 110)"><rect x="495" y="65" width="205" height="100" rx="3" fill="none" stroke="#a94127" stroke-width="3"/><text x="597" y="108" text-anchor="middle" font-size="21" font-weight="700">One next step</text><text x="597" y="137" text-anchor="middle" font-size="15">What should they do?</text></g><text x="25" y="208" font-size="15">A clearer message starts with a clearer understanding of the customer.</text></g></svg>