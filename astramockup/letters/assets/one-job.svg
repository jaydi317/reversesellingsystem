<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="title desc"><title id="title">Give the helper a job it can finish.</title><desc id="desc">AI can make a first pass. You keep the judgment.</desc><rect width="720" height="230" fill="#f8f5ef"/><g fill="#252622" font-family="Arial,sans-serif"><text x="25" y="35" font-size="18" font-weight="700">Give the helper a job it can finish.</text><g transform="rotate(-1 125 110)"><rect x="25" y="65" width="205" height="100" rx="3" fill="none" stroke="#252622" stroke-width="3"/><text x="127" y="108" text-anchor="middle" font-size="21" font-weight="700">One small job</text><text x="127" y="137" text-anchor="middle" font-size="15">Name the result.</text></g><path d="M 237 115 h 18 m -7 -6 l 7 6 -7 6" stroke="#a94127" fill="none" stroke-width="3"/><g transform="rotate(1 360 110)"><rect x="260" y="65" width="205" height="100" rx="3" fill="none" stroke="#252622" stroke-width="3"/><text x="362" y="108" text-anchor="middle" font-size="21" font-weight="700">Facts + rules</text><text x="362" y="137" text-anchor="middle" font-size="15">Give it the context.</text></g><path d="M 472 115 h 18 m -7 -6 l 7 6 -7 6" stroke="#a94127" fill="none" stroke-width="3"/><g transform="rotate(-1 595 110)"><rect x="495" y="65" width="205" height="100" rx="3" fill="none" stroke="#a94127" stroke-width="3"/><text x="597" y="108" text-anchor="middle" font-size="21" font-weight="700">Your check</text><text x="597" y="137" text-anchor="middle" font-size="15">Approve the result.</text></g><text x="25" y="208" font-size="15">AI can make a first pass. You keep the judgment.</text></g></svg>